<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- IQly Part 3 creative, 250×250. v5 growth-led design (hook → participation → payoff → action),
     purple/yellow/green v4 palette. Self-contained: system fonts, inline SVG, zero external requests. -->
<style>html,body{margin:0;padding:0;width:250px;height:250px;overflow:hidden;background:#FBFAFF}*{box-sizing:border-box}</style>
</head>
<body>
<div style="flex:none;width:250px;height:250px;box-sizing:border-box;background:#24154F;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="display:flex;align-items:center;gap:5px"><div style="width:20px;height:20px;border-radius:6px;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="none" stroke="#5A3FD8" stroke-width="4"/><circle cx="24" cy="24" r="11" fill="none" stroke="#5A3FD8" stroke-width="4"/><circle cx="24" cy="24" r="3" fill="#FFD24A"/></svg></div><span style="font-size:11px;font-weight:800;letter-spacing:0.05em;color:#FFFFFF">IQLY</span></div>
            <span style="font-size:9px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;color:#24154F;background:#7EE2B3;padding:3px 7px;border-radius:999px;white-space:nowrap">Free IQ test</span>
          </div>
          <p style="margin:0;font-size:17px;font-weight:800;line-height:1.1;color:#FFFFFF;letter-spacing:-0.01em">What’s your IQ? Find out free in <span style="color:#FFD24A;white-space:nowrap">4 minutes.</span></p>
          <div style="display:flex;gap:8px;align-items:stretch">
            <div style="flex:none;width:72px;height:72px;border-radius:10px;background:#FFFFFF;padding:5px;box-sizing:border-box"><svg viewBox="0 0 100 100" width="62" height="62"><circle cx="25" cy="25" r="5" fill="#000"></circle><circle cx="65" cy="20" r="5" fill="#000"></circle><circle cx="80" cy="30" r="5" fill="#000"></circle><circle cx="15" cy="70" r="5" fill="#000"></circle><circle cx="30" cy="80" r="5" fill="#000"></circle><text x="75" y="82" font-size="20" text-anchor="middle">?</text><line x1="50" y1="0" x2="50" y2="100" stroke="#ccc"></line><line x1="0" y1="50" x2="100" y2="50" stroke="#ccc"></line></svg></div>
            <div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5px">
              <div style="border-radius:8px;background:#2F1F66;border:1.5px solid #3A2A78;display:flex;align-items:center;gap:5px;padding:0 5px;font-size:11px;font-weight:700;color:#FFFFFF;white-space:nowrap"><span style="flex:none;width:18px;height:18px;border-radius:5px;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 40 40" width="15" height="15"><circle cx="12" cy="20" r="4" fill="#000"></circle><circle cx="28" cy="20" r="4" fill="#000"></circle></svg></span>2 dots</div>
              <div style="border-radius:8px;background:#2F1F66;border:1.5px solid #3A2A78;display:flex;align-items:center;gap:5px;padding:0 5px;font-size:11px;font-weight:700;color:#FFFFFF;white-space:nowrap"><span style="flex:none;width:18px;height:18px;border-radius:5px;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 40 40" width="15" height="15"><circle cx="10" cy="28" r="4" fill="#000"></circle><circle cx="20" cy="10" r="4" fill="#000"></circle><circle cx="30" cy="28" r="4" fill="#000"></circle></svg></span>3 dots</div>
              <div style="border-radius:8px;background:#2F1F66;border:1.5px solid #3A2A78;display:flex;align-items:center;gap:5px;padding:0 5px;font-size:11px;font-weight:700;color:#FFFFFF;white-space:nowrap"><span style="flex:none;width:18px;height:18px;border-radius:5px;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 40 40" width="15" height="15"><circle cx="10" cy="10" r="4" fill="#000"></circle><circle cx="30" cy="10" r="4" fill="#000"></circle><circle cx="10" cy="30" r="4" fill="#000"></circle><circle cx="30" cy="30" r="4" fill="#000"></circle></svg></span>4 dots</div>
              <div style="border-radius:8px;background:#2F1F66;border:1.5px solid #3A2A78;display:flex;align-items:center;gap:5px;padding:0 5px;font-size:11px;font-weight:700;color:#FFFFFF;white-space:nowrap"><span style="flex:none;width:18px;height:18px;border-radius:5px;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 40 40" width="15" height="15"><circle cx="20" cy="20" r="4" fill="#000"></circle></svg></span>1 dot</div>
            </div>
          </div>
          <div style="margin-top:auto;height:40px;border-radius:11px;background:#FFD24A;box-shadow:0 3px 0 #E0AE14;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#24154F;white-space:nowrap">Start the Free Test →</div>
          <span style="font-size:9.5px;font-weight:600;color:#C9BCFF;text-align:center;white-space:nowrap">Question 1 of 12 · No signup to start</span>
        </div>
</body>
</html>
